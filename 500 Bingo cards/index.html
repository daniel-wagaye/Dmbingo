<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bingo Cards Viewer</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0b1020;
      --panel: #151b2f;
      --border: #2a3558;
      --text: #f7f9ff;
      --muted: #a9b3d9;
      --accent: #6ea8fe;
      --free: #2a8f6a;
    }
    * {
      box-sizing: border-box;
      font-family: Inter, Segoe UI, Arial, sans-serif;
    }
    body {
      margin: 0;
      background: radial-gradient(circle at top, #15203f 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .app {
      width: min(760px, 100%);
      background: color-mix(in srgb, var(--panel) 92%, black 8%);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }
    .top {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .top h1 {
      margin: 0;
      font-size: 1.1rem;
      margin-right: auto;
    }
    button, input {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #1a2442;
      color: var(--text);
      padding: 8px 12px;
      font-size: 0.95rem;
    }
    button {
      cursor: pointer;
    }
    button:hover {
      border-color: var(--accent);
    }
    input {
      width: 110px;
    }
    .meta {
      color: var(--muted);
      margin-bottom: 12px;
      font-size: 0.95rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      background: #0f1730;
      border-radius: 10px;
      overflow: hidden;
    }
    th, td {
      border: 1px solid var(--border);
      text-align: center;
      padding: 14px 6px;
      font-size: 1.05rem;
      font-weight: 600;
    }
    th {
      background: #1c2a4d;
      letter-spacing: 0.08em;
    }
    td.free {
      background: color-mix(in srgb, var(--free) 70%, #0f1730 30%);
      font-weight: 700;
    }
    .error {
      color: #ffb4b4;
      margin-top: 10px;
      min-height: 1.2rem;
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="top">
      <h1>DM Bingo Cards</h1>
      <button id="prevBtn">Prev</button>
      <input id="cardInput" type="number" min="1" step="1" />
      <button id="goBtn">Go</button>
      <button id="nextBtn">Next</button>
      <button id="randomBtn">Random</button>
    </div>
    <div id="meta" class="meta"></div>
    <table>
      <thead>
        <tr>
          <th>B</th>
          <th>I</th>
          <th>N</th>
          <th>G</th>
          <th>O</th>
        </tr>
      </thead>
      <tbody id="cardBody"></tbody>
    </table>
    <div id="error" class="error"></div>
  </main>

  <script type="module">
    const bodyEl = document.getElementById('cardBody');
    const metaEl = document.getElementById('meta');
    const errorEl = document.getElementById('error');
    const cardInput = document.getElementById('cardInput');
    const prevBtn = document.getElementById('prevBtn');
    const goBtn = document.getElementById('goBtn');
    const nextBtn = document.getElementById('nextBtn');
    const randomBtn = document.getElementById('randomBtn');

    let cards = {};
    let maxId = 0;
    let currentId = 1;

    function clampCardId(value) {
      if (!Number.isFinite(value)) return 1;
      return Math.max(1, Math.min(maxId, Math.trunc(value)));
    }

    function renderCard(id) {
      const card = cards[String(id)];
      if (!card) {
        errorEl.textContent = `Card ${id} not found`;
        return;
      }

      errorEl.textContent = '';
      currentId = id;
      cardInput.value = String(id);
      metaEl.textContent = `Showing card ${id} of ${maxId}`;

      bodyEl.innerHTML = '';
      for (const row of card) {
        const tr = document.createElement('tr');
        for (const value of row) {
          const td = document.createElement('td');
          if (value === 0) {
            td.textContent = 'FREE';
            td.className = 'free';
          } else {
            td.textContent = String(value);
          }
          tr.appendChild(td);
        }
        bodyEl.appendChild(tr);
      }
    }

    function goTo(value) {
      renderCard(clampCardId(value));
    }

    async function init() {
      try {
        const res = await fetch('./bingoCards.json');
        if (!res.ok) throw new Error(`Failed to load bingoCards.json (${res.status})`);
        cards = await res.json();
        maxId = Object.keys(cards).length;
        cardInput.max = String(maxId);
        goTo(1);
      } catch (err) {
        errorEl.textContent = err instanceof Error ? err.message : 'Failed to load cards';
      }
    }

    prevBtn.addEventListener('click', () => goTo(currentId - 1));
    goBtn.addEventListener('click', () => goTo(Number(cardInput.value)));
    nextBtn.addEventListener('click', () => goTo(currentId + 1));
    randomBtn.addEventListener('click', () => goTo(Math.floor(Math.random() * maxId) + 1));
    cardInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') goTo(Number(cardInput.value));
    });

    init();
  </script>
</body>
</html>
